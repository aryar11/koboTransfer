services:
  kobosend:
    build: .
    image: kobosend:latest
    container_name: kobosend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    volumes:
      # Point DATA_PATH at your TrueNAS dataset, e.g. /mnt/tank/apps/kobosend
      - ${DATA_PATH:-./data}:/data
    ports:
      # Loopback only: the reverse proxy terminates TLS and forwards here.
      # If your proxy runs in another container, drop this and join its network instead.
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    user: "${APP_UID:-568}:${APP_GID:-568}"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
